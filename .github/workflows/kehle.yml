name: Build GENRA Kehle

# GENRA KEHLE: the neon vocoder KEHLE, a test plugin of its own in the folder genra-kehle/ (builds when something there changes)
on:
  push:
    paths:
      - "genra-kehle/**"
      - ".github/workflows/kehle.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: genra-kehle
    steps:
      - uses: actions/checkout@v4

      - name: Download Rack SDK
        shell: pwsh
        working-directory: genra-kehle
        run: |
          Invoke-WebRequest -Uri https://vcvrack.com/downloads/Rack-SDK-latest-win-x64.zip -OutFile sdk.zip
          Expand-Archive sdk.zip -DestinationPath sdk

      - name: Fetch GENRA's shared parts (knobs, Follow GENRA, link hub, look)
        shell: bash
        working-directory: genra-kehle
        run: |
          git clone -q --depth 1 -b dev https://github.com/Camillowup/Genra-for-Vcv .genra-repo
          cp -r .genra-repo/src genra
          mkdir -p res && cp -r .genra-repo/res/knob res/knob
          rm -rf .genra-repo

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            make zip tar zstd sed
            mingw-w64-x86_64-gcc

      - name: Engine test (every preset vocodes a test voice; no NaN, no silence, stress run)
        run: |
          g++ -O2 -std=c++11 -I. test/kehle_test.cpp -o kehle_test.exe
          ./kehle_test.exe check

      - name: Build plugin GENRA Kehle
        run: |
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          echo "Version $VER"
          make RACK_DIR=sdk/Rack-SDK SLUG=GenraKehle VERSION=$VER -j4 dist

      - name: Check the package
        run: |
          D=dist/GenraKehle
          ls -la $D $D/res
          test -f $D/plugin.dll
          test -f $D/res/Kehle.svg
          if objdump -p $D/plugin.dll | grep -iE "libstdc"; then echo "plugin.dll loads libstdc++"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: genra-kehle-windows
          path: genra-kehle/dist/*.vcvplugin

  # macOS only by hand (Actions › Run workflow): GitHub has few Mac runners
  mac:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    defaults:
      run:
        working-directory: genra-kehle
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GENRA's shared parts
        run: |
          git clone -q --depth 1 -b dev https://github.com/Camillowup/Genra-for-Vcv .genra-repo
          cp -r .genra-repo/src genra
          mkdir -p res && cp -r .genra-repo/res/knob res/knob
          rm -rf .genra-repo
      - name: Download Rack SDK
        run: |
          curl -sSL -o sdk.zip https://vcvrack.com/downloads/Rack-SDK-latest-mac-${{ matrix.arch }}.zip
          mkdir sdk && cd sdk && unzip -q ../sdk.zip
      - name: Compiler
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            echo "CC=clang -arch x86_64" >> $GITHUB_ENV
            echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
          fi
          brew install zstd || true
      - name: Build plugin GENRA Kehle
        run: |
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          make RACK_DIR=$GITHUB_WORKSPACE/genra-kehle/sdk/Rack-SDK SLUG=GenraKehle VERSION=$VER -j4 dist
      - uses: actions/upload-artifact@v4
        with:
          name: genra-kehle-mac-${{ matrix.arch }}
          path: genra-kehle/dist/*.vcvplugin
