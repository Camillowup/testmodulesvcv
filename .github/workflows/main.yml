name: Build GENRA Test

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Download Rack SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://vcvrack.com/downloads/Rack-SDK-latest-win-x64.zip -OutFile sdk.zip
          Expand-Archive sdk.zip -DestinationPath sdk

      - name: Fetch GENRA's shared parts (knobs, Follow GENRA, link hub)
        shell: bash
        run: |
          git clone -q --depth 1 https://github.com/Camillowup/Genra-for-Vcv .genra-repo
          cp -r .genra-repo/src genra
          mkdir -p res && cp -r .genra-repo/res/knob res/knob
          rm -rf .genra-repo

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            make zip tar zstd sed
            mingw-w64-x86_64-gcc

      - name: Build plugin GENRA Test
        run: |
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          echo "Version $VER"
          make RACK_DIR=sdk/Rack-SDK SLUG=GenraTest VERSION=$VER -j4 dist

      - name: Test the cores (without Rack)
        run: |
          gcc -std=gnu11 -O2 -w test/mathcore_test.c -o mt.exe -lm && cp res/mathcore.dll . 
          ./mt.exe ./mathcore.dll
          gcc -std=gnu11 -O2 -w test/kurbelcore_test.c -o kt.exe -lm && cp res/kurbelcore.dll .
          ./kt.exe ./kurbelcore.dll
          gcc -std=gnu11 -O2 -w test/swarmcore_test.c -o st.exe -lm && cp res/swarmcore.dll .
          ./st.exe ./swarmcore.dll
          gcc -std=gnu11 -O2 -w test/liedcore_test.c -o lt.exe -lm && cp res/liedcore.dll .
          ./lt.exe ./liedcore.dll res/espeak-ng-data
          g++ -std=c++11 -O2 -w test/lied_test.cpp -o lst.exe
          ./lst.exe ./liedcore.dll res/espeak-ng-data

      - name: Check the package
        run: |
          D=dist/GenraTest
          ls -la $D $D/res
          test -f $D/plugin.dll
          test -f $D/res/mathcore.dll
          test -f $D/res/Math.svg
          test -f $D/res/kurbelcore.dll
          test -f $D/res/Kurbel.svg
          test -f $D/res/swarmcore.dll
          test -f $D/res/Swarm.svg
          test -f $D/res/liedcore.dll
          test -f $D/res/Lied.svg
          test -f $D/res/espeak-ng-data/phondata
          test -f $D/res/espeak-ng-data/de_dict
          test -d "$D/res/espeak-ng-data/voices/!v"
          test -f $D/res/knob/small.svg
          objdump -p $D/plugin.dll | grep "DLL Name"
          if objdump -p $D/plugin.dll | grep -iE "libstdc"; then echo "plugin.dll loads libstdc++"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: genra-test-windows
          path: dist/*.vcvplugin
